<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0f1e" />
    <meta name="description" content="ExpenseTracker — A privacy-first offline personal finance tracker. Track income, expenses, budgets and more. No account required. Works 100% offline." />
    <meta name="keywords" content="expense tracker, personal finance, budget, offline, pwa, privacy" />
    <meta name="author" content="ExpenseTracker" />

    <!-- Open Graph -->
    <meta property="og:title" content="ExpenseTracker — Personal Finance" />
    <meta property="og:description" content="Track your money privately. Everything stays on this device." />
    <meta property="og:type" content="website" />

    <!-- Apple PWA -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ExpenseTracker" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>ExpenseTracker — Personal Finance</title>

    <!-- Prevent flash of wrong theme -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('expenseTrackerData');
          var theme = 'dark';
          if (saved) {
            var data = JSON.parse(saved);
            theme = (data.settings && data.settings.theme) || 'dark';
            if (theme === 'system') {
              theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch(e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run ExpenseTracker.</noscript>
    <div id="root"></div>
  </body>
</html>
